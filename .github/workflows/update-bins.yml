name: Update bins

on:
  schedule:
    - cron: "23 4,16 * * *"   # twice a day (UTC)
  workflow_dispatch:           # adds a "Run workflow" button

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch bin dates
        run: python fetch_bins.py
        env:
          BIN_UPRN: ${{ secrets.BIN_UPRN }}
      - name: Commit changes
        run: |
          git config user.name "bins-bot"
          git config user.email "bins-bot@users.noreply.github.com"
          git add docs/
          if ! git diff --cached --quiet; then
            git commit -m "Update bin dates"
            git pull --rebase
            git push
          fi
